name: Release

# Production builds run only for version tags. Pushing to a branch never
# publishes anything; use the manual trigger to exercise the build itself.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Never cancel a release build half-way through — a partly uploaded
  # release is worse than a slow one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Version/tag logic lives here once rather than duplicated per platform —
  # both platform jobs `needs: meta` and read its outputs; if the tag check
  # below fails, neither platform job runs at all.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # Manual run: nothing is published, so take the version from the
            # manifest just to name the artifacts.
            version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          # A tag like v1.1.0-rc.1 publishes as a pre-release.
          if [ "${GITHUB_REF_NAME}" != "${GITHUB_REF_NAME%-*}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The installers take their version from Cargo.toml, not from the
      # tag. If those drift, the release ships artifacts labelled with the
      # wrong version, so stop before spending time on either platform build.
      - name: Check the tag matches Cargo.toml
        if: steps.meta.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          want="${{ steps.meta.outputs.version }}"
          got="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [ "$got" != "$want" ]; then
            echo "::error file=Cargo.toml::Cargo.toml is at ${got}, but the tag says ${want}"
            echo "Bump Cargo.toml to ${want}, commit, then move the tag."
            exit 1
          fi
          echo "ok  Cargo.toml = ${got}"

  release-windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for the whole workflow rather than one per tag.
          shared-key: windows-release

      - name: Run tests
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      # cargo-wix finds candle/light via the WIX environment variable, and
      # the chocolatey package shims `makensis` straight onto PATH — neither
      # needs its install path guessed.
      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      # The chocolatey package installs makensis, but a mid-job PATH change
      # from an installer isn't visible to later steps on the GitHub-hosted
      # Windows runner unless it's added to $GITHUB_PATH explicitly (the
      # runner's steps don't re-read the registry between steps the way an
      # interactive shell with `refreshenv` would).
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      # Builds the release binary, then the MSI, then the NSIS installer —
      # see xtask/src/main.rs. Reads the version straight from Cargo.toml,
      # already checked against the tag by the `meta` job.
      - name: Build everything
        run: cargo bundle

      - name: Collect artifacts
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="$VERSION"
          mkdir -p release

          # Globs are scoped to this version rather than left open, so a
          # leftover build from an earlier run can't silently slip in.
          pick() {
            local label="$1"; shift
            if [ "$#" -ne 1 ]; then
              echo "::error::expected exactly one ${label} for ${version}, found $#: $*" >&2
              return 1
            fi
            printf '%s\n' "$1"
          }

          msi="$(pick 'MSI package' target/wix/*.msi)"
          nsis="$(pick 'NSIS installer' "target/release/ContextPassword-${version}-x64-setup.exe")"

          cp target/release/context-password.exe \
             "release/ContextPassword-${version}-x64-portable.exe"
          cp "$nsis" "release/ContextPassword-${version}-x64-setup.exe"
          cp "$msi"  "release/ContextPassword-${version}-x64.msi"

          cd release
          sha256sum ./*.exe ./*.msi | sed 's|\./||' > checksums.txt
          ls -lh
          cat checksums.txt

      # Uploaded even on a manual run, so a build can be checked without
      # publishing anything.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: context-password-${{ needs.meta.outputs.version }}-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release-macos:
    needs: meta
    runs-on: macos-15
    # Disabled for now, kept in place rather than deleted: `cargo packager`'s
    # `--config <json>` flag (used by xtask to override the ad-hoc signing
    # identity when APPLE_SIGNING_IDENTITY is set) turns out to *replace*
    # the whole config rather than merge with `[package.metadata.packager]`
    # in Cargo.toml — confirmed by reading `crates/packager/src/cli/config.rs`
    # upstream (`detect_configs`: a raw JSON `--config` short-circuits
    # straight to `serde_json::from_str::<Config>`, never touching the
    # Cargo.toml-derived config at all). Also, `${{ secrets.X }}` evaluates
    # to an *empty string*, not unset, when a secret doesn't exist — so this
    # override was firing unconditionally even with no signing secrets
    # configured, silently discarding `binaries`/`out-dir` and breaking
    # every build, not just real-signing ones. Needs `xtask` to build the
    # whole packager config itself (as JSON, always passed via `--config`,
    # so there's a single source of truth and no merge ambiguity) before
    # this can come back on. Flip this back to `true` once that's done.
    if: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release

      - name: Run tests
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # Builds both architectures, `lipo`s them into one universal binary,
      # then bundles + signs the .app and .dmg — see xtask/src/main.rs.
      # Ad-hoc signing needs no secrets at all; every one of these is only
      # read when actually present, and `cargo-packager` itself falls back
      # to ad-hoc / skips notarization with a warning (not a failure) when
      # they're absent — see Cargo.toml's `[package.metadata.packager]` and
      # `context-password-project/development/apple-signing-setup.md` for
      # how a real Apple Developer account configures these.
      - name: Build everything
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: cargo bundle

      - name: Collect artifacts
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          mkdir -p release

          dmg="target/packager/Context Password_${version}_universal.dmg"
          if [ ! -f "$dmg" ]; then
            echo "::error::expected DMG not found: $dmg" >&2
            exit 1
          fi
          cp "$dmg" "release/ContextPassword-${version}-universal.dmg"

          cd release
          shasum -a 256 ./*.dmg | sed 's|\./||' > checksums.txt
          ls -lh
          cat checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: context-password-${{ needs.meta.outputs.version }}-macos
          path: release/*
          if-no-files-found: error
          retention-days: 14

  # Only this job actually creates the GitHub Release, once whichever
  # platform jobs are enabled have finished — avoids either platform job
  # racing to publish, or publishing a release that's missing a platform
  # that failed. Deliberately tolerant of `release-macos` being disabled
  # (see that job's `if: false`) or absent from a future platform matrix:
  # `always()` bypasses the default "skip if a dependency skipped" cascade,
  # and every step below adapts to whichever artifact sets actually exist
  # rather than assuming both are always present.
  publish:
    needs: [meta, release-windows, release-macos]
    if: |
      always() &&
      needs.meta.outputs.release == 'true' &&
      needs.release-windows.result == 'success' &&
      needs.release-macos.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: context-password-${{ needs.meta.outputs.version }}-windows-x64
          path: release/windows

      - name: Download macOS artifacts
        if: needs.release-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: context-password-${{ needs.meta.outputs.version }}-macos
          path: release/macos

      # Both platform jobs upload their own `checksums.txt` — merge rather
      # than let one silently clobber the other when flattened together.
      # Copies whatever each platform's `release/<os>` directory actually
      # contains rather than a hardcoded file list, so this doesn't need
      # editing every time a platform is temporarily disabled or a new one
      # is added.
      - name: Combine artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release/combined
          checksum_files=()
          for os_dir in release/windows release/macos; do
            [ -d "$os_dir" ] || continue
            for f in "$os_dir"/*; do
              [ "$(basename "$f")" = "checksums.txt" ] && continue
              cp "$f" release/combined/
            done
            [ -f "$os_dir/checksums.txt" ] && checksum_files+=("$os_dir/checksums.txt")
          done
          if [ "${#checksum_files[@]}" -eq 0 ]; then
            echo "::error::no checksums.txt found in any platform artifact set" >&2
            exit 1
          fi
          cat "${checksum_files[@]}" > release/combined/checksums.txt
          ls -lh release/combined
          cat release/combined/checksums.txt

      - name: Assemble release notes
        run: |
          set -euo pipefail
          bash .github/scripts/release-notes.sh "${{ needs.meta.outputs.version }}" > notes.md
          echo "--- release notes ---"
          cat notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Context Password for Bitwarden ${{ needs.meta.outputs.version }}
          body_path: notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: release/combined/*
