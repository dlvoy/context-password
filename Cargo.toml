[package]
name = "context-password"
version = "1.1.0"
edition = "2024"
description = "Global-hotkey popup that auto-types Bitwarden passwords via the bw CLI"
authors = ["Dominik Dzienia"]
license = "MIT"
repository = "https://github.com/dlvoy/context-password"
publish = false

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.36", default-features = false }
global-hotkey = "0.8"
tray-icon = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
log = "0.4"
raw-window-handle = "0.6"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_System_LibraryLoader",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
