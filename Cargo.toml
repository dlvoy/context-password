[package]
name = "context-password"
version = "1.3.0"
edition = "2024"
description = "Global-hotkey popup that auto-types Bitwarden passwords via the bw CLI"
authors = ["Dominik Dzienia"]
license = "MIT"
repository = "https://github.com/dlvoy/context-password"
publish = false

[dependencies]
global-hotkey = "0.8"
tray-icon = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
log = "0.4"

# egui/eframe are the Windows front-end only — macOS uses native AppKit
# (src/mac_ui/, Phase 5 of the port plan). Keeping them target-scoped is what
# lets `cargo build`/`cargo test` run on macOS at all.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.36", default-features = false }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-application-services = { version = "0.3", features = ["AXUIElement", "AXError"] }
objc2-service-management = "0.3"
objc2-core-graphics = { version = "0.3", features = [
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
] }
objc2-app-kit = { version = "0.3", features = [
    "std",
    "libc",
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSWorkspace",
    "NSScreen",
    "NSEvent",
    "NSWindow",
    "NSPanel",
    "NSView",
    "NSColor",
    "NSBezierPath",
    "NSGraphics",
    "NSGraphicsContext",
] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_System_LibraryLoader",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
